<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg1)"/>

  <!-- Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Connection Lines -->
  <g stroke="url(#accent1)" stroke-width="3" fill="none" opacity="0.7">
    <path d="M 600 337 L 350 200"/>
    <path d="M 600 337 L 850 200"/>
    <path d="M 600 337 L 350 475"/>
    <path d="M 600 337 L 850 475"/>
  </g>

  <!-- Central API Node -->
  <circle cx="600" cy="337" r="90" fill="#0f172a" stroke="url(#accent1)" stroke-width="4"/>
  <circle cx="600" cy="337" r="70" fill="#14b8a6" opacity="0.15"/>
  <text x="600" y="345" text-anchor="middle" font-family="monospace" font-size="28" font-weight="700" fill="#14b8a6">&lt;/&gt;</text>

  <!-- Surrounding Nodes -->
  <g>
    <rect x="310" y="160" width="80" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="350" y="210" text-anchor="middle" font-family="monospace" font-size="20" fill="#14b8a6">DB</text>

    <rect x="810" y="160" width="80" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="850" y="210" text-anchor="middle" font-family="monospace" font-size="20" fill="#14b8a6">JWT</text>

    <rect x="310" y="435" width="80" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="350" y="485" text-anchor="middle" font-family="monospace" font-size="20" fill="#14b8a6">API</text>

    <rect x="810" y="435" width="80" height="80" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="850" y="485" text-anchor="middle" font-family="monospace" font-size="20" fill="#14b8a6">DKR</text>
  </g>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#ffffff">Atlantis Portfolio Backend</text>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">REST API · ASP.NET Core 10 · EF Core · SQL Server</text>

  <!-- Footer -->
  <text x="600" y="625" text-anchor="middle" font-family="monospace" font-size="16" fill="#14b8a6">16 xUnit Tests · JWT Auth · Docker</text>
</svg>