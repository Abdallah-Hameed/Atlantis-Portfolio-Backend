<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg3)"/>

  <!-- Road -->
  <path d="M 0 550 Q 600 480 1200 550 L 1200 675 L 0 675 Z" fill="url(#road)"/>
  <path d="M 0 550 Q 600 480 1200 550" stroke="#14b8a6" stroke-width="3" opacity="0.5"/>
  
  <!-- Road Dashes -->
  <g stroke="#14b8a6" stroke-width="4" stroke-dasharray="40 30" opacity="0.7">
    <path d="M 0 610 Q 600 545 1200 610" fill="none"/>
  </g>

  <!-- Car Silhouette -->
  <g transform="translate(450, 380)">
    <!-- Body -->
    <path d="M 0 80 L 0 60 Q 0 40 20 35 L 80 20 Q 100 15 120 15 L 220 15 Q 240 15 260 25 L 320 45 Q 340 52 340 70 L 340 80 Q 340 90 330 90 L 10 90 Q 0 90 0 80 Z" 
          fill="#14b8a6" opacity="0.9"/>
    <!-- Window -->
    <path d="M 50 45 L 90 30 Q 100 28 110 28 L 180 28 Q 190 28 200 32 L 240 45 Z" 
          fill="#0f172a" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="80" cy="95" r="22" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="80" cy="95" r="8" fill="#14b8a6"/>
    <circle cx="270" cy="95" r="22" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/>
    <circle cx="270" cy="95" r="8" fill="#14b8a6"/>
    <!-- Headlight -->
    <circle cx="335" cy="65" r="5" fill="#fbbf24"/>
  </g>

  <!-- License Card -->
  <g transform="translate(100, 100)">
    <rect width="200" height="130" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="45" cy="45" r="22" fill="#14b8a6" opacity="0.2" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="45" cy="38" r="8" fill="#14b8a6"/>
    <path d="M 30 58 Q 45 48 60 58" stroke="#14b8a6" stroke-width="2" fill="none"/>
    <line x1="80" y1="35" x2="175" y2="35" stroke="#64748b" stroke-width="3"/>
    <line x1="80" y1="55" x2="160" y2="55" stroke="#64748b" stroke-width="2"/>
    <line x1="80" y1="70" x2="170" y2="70" stroke="#64748b" stroke-width="2"/>
    <line x1="20" y1="100" x2="180" y2="100" stroke="#64748b" stroke-width="1"/>
    <text x="100" y="118" text-anchor="middle" font-family="monospace" font-size="11" fill="#14b8a6">LICENSE</text>
  </g>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#ffffff">DVLD</text>
  <text x="600" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Driver &amp; Vehicle License Department</text>

  <!-- Footer -->
  <text x="600" y="625" text-anchor="middle" font-family="monospace" font-size="16" fill="#14b8a6">C# · WinForms · ADO.NET · SQL Server</text>
</svg>